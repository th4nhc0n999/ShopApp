spring.application.name=shopapp
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.port=8086
api.prefix=/api/v1

# 1. Cấu hình thông tin kết nối DataSource (Lấy từ hình ảnh của bạn)
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:orcl
spring.datasource.username=AdminSA
spring.datasource.password=Admin123
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# 2. Cấu hình Hibernate Dialect dành cho Oracle 21c trở lên
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# 3. Cấu hình tự động đồng bộ Schema từ Entity Java (nếu cần)
spring.jpa.hibernate.ddl-auto=none

# 4. Hiển thị log SQL ra console để dễ debug
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 5. JWT Configuration
jwt.expiration=2592000
jwt.secretKey=DayLaMotChuoiBiMatRaaatDaiDeTaoChuoiKhongBiDoanDuoc123456789